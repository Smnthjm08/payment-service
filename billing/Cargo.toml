[package]
name = "billing"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
chrono = { version = "0.4.45", features = ["serde"] }
dotenv = "0.15.0"
env_logger = "0.11.10"
hex = "0.4"
log = "0.4.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "uuid", "chrono", "time", "sqlx-toml"] }
tokio = "1.52.3"
uuid = { version = "1.23.2", features = ["serde", "v4"] }
