services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payment_service
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  mock-psp:
    build:
      context: .
      dockerfile: Dockerfile.mock-psp
    restart: unless-stopped
    environment:
      MOCK_PSP_PORT: "9090"
      RUST_LOG: "info"
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9090/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  billing:
    build:
      context: .
      dockerfile: Dockerfile.billing
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mock-psp:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/payment_service?sslmode=disable"
      PSP_URL: "http://mock-psp:9090"
      PORT: "8080"
      RUST_LOG: "info,billing=debug"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
